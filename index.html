<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Back to Hialeah — Beat Board</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #2a2520; color: #e8e3d8; }
    .container { padding: 20px; }
    .header { margin-bottom: 30px; }
    .header h1 { font-size: 28px; margin-bottom: 8px; font-weight: 600; }
    .header p { font-size: 14px; opacity: 0.7; }
    .controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    .toggle-btn { padding: 8px 16px; background: rgba(232, 219, 179, 0.1); border: 1px solid rgba(232, 219, 179, 0.3); border-radius: 4px; color: #e8e3d8; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .toggle-btn:hover { background: rgba(232, 219, 179, 0.15); border-color: rgba(232, 219, 179, 0.5); }
    .toggle-btn.active { background: rgba(232, 219, 179, 0.25); border-color: rgba(232, 219, 179, 0.7); }
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .column { display: flex; flex-direction: column; gap: 12px; }
    .column-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; }
    .card { border-radius: 4px; padding: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.35); cursor: default; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); }
    .card-title { font-size: 12.5px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
    .card-summary { font-size: 11px; line-height: 1.4; margin-bottom: 6px; opacity: 0.9; }
    .card-body { font-size: 11px; line-height: 1.4; white-space: pre-wrap; display: none; }
    .card-body.show { display: block; }
    .card.color-0 { background: #E8DAB3; color: #3A2E1F; }
    .card.color-1 { background: #E3B9B4; color: #3E2320; }
    .card.color-2 { background: #B9CBDD; color: #20303E; }
    .card.color-3 { background: #CBBBD9; color: #2E2338; }
    .card.color-4 { background: #BFD6BF; color: #22331F; }
    @media (max-width: 768px) {
      .board { grid-template-columns: 1fr; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
